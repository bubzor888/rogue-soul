<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Room Select Wireframe</title>
<style>
  :root{
    --ink:#3a4a5a;
    --line:#7c8fa3;
    --bg:#eef1f4;
    --card:#ffffff;
    --prog:#5b86b3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#1d2630;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .screen{
    position:relative;
    width:100%;
    max-width:460px;
    min-height:100dvh;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
    padding:env(safe-area-inset-top) 4% calc(env(safe-area-inset-bottom) + 14px) 4%;
    display:flex;
    flex-direction:column;
  }
  .dashed{
    border:1.5px dashed var(--line);
    border-radius:6px;
    background:var(--card);
  }
  .zone-caption{
    font-size:8px;
    color:var(--ink);
    opacity:.4;
    letter-spacing:.05em;
    margin:6px 0 2px 2px;
  }

  /* ---------- Ghost hamburger menu (copied verbatim from combat wireframe) ---------- */
  .menu-ghost{
    position:absolute;
    top:3%;
    right:4%;
    width:28%;
    padding:5px 4px;
    text-align:center;
    opacity:.4;
    z-index:5;
  }
  .menu-ghost .glyph{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .menu-ghost .label{
    font-size:8px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
  }

  /* ---------- Heading ---------- */
  .heading-wrap{
    text-align:center;
    margin-top:60px;
    margin-bottom:2px;
  }
  .heading{
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
  }

  /* ---------- Doors: side by side, anchored above the vessel ---------- */
  .doors-wrap{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    margin-top:8px;
  }
  .doors{
    display:flex;
    gap:16px;
    align-items:stretch;
    width:100%;
    max-width:340px;
  }
  .door{
    flex:1;
    aspect-ratio:3/4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px 8px;
    position:relative;
  }
  .door .symbol-box{
    width:80%;
    aspect-ratio:1/1;
    border:1.5px dashed var(--line);
    border-radius:8px;
    background:#f4f7fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px;
  }
  .door .symbol-box .ph{
    font-size:9px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
    line-height:1.5;
  }
  .door .tap-tag{
    font-size:9px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.6;
  }

  /* ---------- Vessel: anchors the lower scene, combat-sprite scale ---------- */
  .vessel-wrap{
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    min-height:0;
    padding-bottom:6px;
  }
  .vessel{
    width:42%;
    max-width:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .vessel .sprite-box{
    width:100%;
    aspect-ratio:1/1.2;
    border:1.5px dashed var(--line);
    border-radius:8px;
    background:#f4f7fa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
    text-align:center;
  }
  .vessel .vcap{
    font-size:8px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.4;
  }

  /* ---------- Bottom: segmented floor-progress bar ---------- */
  .progress-wrap{
    margin-top:18px;
  }

  .progress-bar{
    display:flex;
    gap:4px;
  }
  .progress-bar .seg{
    flex:1;
    height:9px;
    border-radius:3px;
    border:1.5px solid var(--line);
    background:var(--card);
  }
  .progress-bar .seg.done{
    background:var(--prog);
    border-color:var(--prog);
    opacity:.85;
  }
  .progress-bar .seg.current{
    background:var(--card);
    border-color:var(--prog);
    border-style:dashed;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="zone-caption">FLOOR 3 · WIREFRAME — ROOM SELECT</div>

  <!-- Ghost hamburger, top-right, matches combat screen exactly -->
  <div class="menu-ghost dashed">
    <div class="glyph">≡</div>
    <div class="label">menu</div>
  </div>

  <div class="heading-wrap">
    <div class="heading">Choose a door</div>
  </div>

  <!-- Two doors, side by side, equal weight, symbol-only -->
  <div class="doors-wrap">
    <div class="doors">

      <div class="door dashed">
        <div class="symbol-box">
          <div class="ph">door symbol<br>(skeleton)</div>
        </div>
        <div class="tap-tag">tap to enter</div>
      </div>

      <div class="door dashed">
        <div class="symbol-box">
          <div class="ph">door symbol<br>(memory fragment)</div>
        </div>
        <div class="tap-tag">tap to enter</div>
      </div>

    </div>
  </div>

  <!-- Vessel: anchors the scene, same scale as combat sprite -->
  <div class="vessel-wrap">
    <div class="vessel">
      <div class="sprite-box">vessel<br>sprite<br>(back/3rd person — TBD)</div>
      <div class="vcap">your vessel</div>
    </div>
  </div>

  <!-- Floor progress: one segment per room, precise count -->
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="seg done"></div>
      <div class="seg done"></div>
      <div class="seg done"></div>
      <div class="seg done"></div>
      <div class="seg current"></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
    </div>
  </div>

</div>
</body>
</html>
