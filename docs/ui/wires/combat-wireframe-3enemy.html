<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Combat Wireframe — 3 Enemy Triangle</title>
<style>
  :root{
    --ink:#3a4a5a;
    --line:#7c8fa3;
    --bg:#eef1f4;
    --card:#ffffff;
    --hp:#c0596b;
    --hp-track:#e3dcdc;
    --prog:#5b86b3;
    --prog-track:#dbe3ea;
    --status:#c9a24a;
    --intent:#9a5fb8;
    /* Circle diameter, frozen at its current size — derived once from
       dvh/px/env (axis-independent units) so it can be reused safely in
       both the vertical (height) and horizontal (left/right) math below. */
    --circle-d: calc((12dvh - 12px - env(safe-area-inset-bottom)) / 0.75);
    /* Rectangle height = 65% of circle diameter, so with bottoms aligned
       the remaining 35% of the circle pokes above the rectangle's top. */
    --rect-h: calc(var(--circle-d) * 0.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#1d2630;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .screen{
    position:relative;
    width:100%;
    max-width:460px;
    height:100dvh;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .label{
    font-size:9px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.65;
    text-align:center;
  }
  .dashed{
    border:1.5px dashed var(--line);
    border-radius:6px;
    background:var(--card);
  }

  /* ---------- Omen countdown badge ---------- */
  .omen-badge{
    position:absolute;
    top:3%;
    left:4%;
    width:28%;
    padding:5px 4px;
    text-align:center;
    z-index:5;
  }
  .omen-badge .count{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .menu-ghost{
    position:absolute;
    top:3%;
    right:4%;
    width:28%;
    padding:5px 4px;
    text-align:center;
    opacity:.4;
    z-index:5;
  }
  .menu-ghost .glyph{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }

  /* ---------- Enemy formation ---------- */
  .enemy{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:30%;
  }
  .enemy.back{ top:18%; left:50%; width:26%; }
  .enemy.front-left{ top:36%; left:20%; width:26%; }
  .enemy.front-right{ top:36%; left:80%; width:26%; }

  .intent-pill{
    width:46%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:1.5px dashed var(--intent);
    background:#f6eefa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    color:var(--intent);
    text-transform:uppercase;
    margin-bottom:4px;
    letter-spacing:.04em;
  }
  .sprite-box{
    width:100%;
    aspect-ratio:1/1.1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--ink);
  }
  .hp-horiz{
    width:90%;
    height:9px;
    border-radius:4px;
    background:var(--hp-track);
    border:1px solid var(--line);
    margin-top:4px;
    position:relative;
    overflow:hidden;
  }
  .hp-horiz .fill{
    position:absolute;
    top:0; bottom:0; left:0;
    background:var(--hp);
  }
  .status-row{
    display:flex;
    gap:3px;
    margin-top:4px;
    justify-content:center;
  }
  .status-chip{
    /* 32px = spec display size for status icons (16x16 source at 2x), per UI-ART-004 */
    width:32px;
    height:32px;
    border-radius:6px;
    border:1.5px dashed var(--status);
    background:#fbf3e2;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--status);
  }
  .status-more{
    font-size:8px;
    color:var(--ink);
    opacity:.6;
    align-self:center;
  }

  /* ---------- Vessel + companions ---------- */
  .companion{
    position:absolute;
    transform:translate(-50%,-50%);
    width:17%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .companion.left{ top:72%; left:19%; }
  .companion.right{ top:72%; left:81%; }
  .companion .sprite-box{ aspect-ratio:1/1; font-size:9px; }

  .vessel{
    position:absolute;
    top:72%;
    left:50%;
    transform:translate(-50%,-50%);
    width:26%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .vessel .sprite-box{ aspect-ratio:1/1.2; font-size:10px; width:100%; }

  /* ---------- Action bar ---------- */
  .action-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    height:12%;
  }
  .action-btn{
    position:absolute;
    bottom:calc(6px + env(safe-area-inset-bottom));
    height:var(--rect-h);
    width:26%;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:600;
    color:var(--ink);
    gap:2px;
  }
  /* Inner edge of each rectangle is positioned to land exactly at the
     circle's outer edge (50% ± half the circle diameter) — touching,
     not overlapping. The visual "cut-in" feel is deferred to sprite art. */
  .action-btn:first-of-type{ left:calc(50% - (var(--circle-d) / 2) - 26%); }
  .action-btn:last-of-type{ right:calc(50% - (var(--circle-d) / 2) - 26%); }
  .action-btn .sub{
    font-size:7px;
    font-weight:400;
    opacity:.6;
    text-transform:uppercase;
  }
  /* Circle size is frozen via --circle-d (unchanged from before). */
  .action-btn-circle{
    position:absolute;
    left:50%;
    bottom:calc(6px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    height:var(--circle-d);
    aspect-ratio:1/1;
    border-radius:50%;
    border:1.5px dashed var(--line);
    background:var(--card);
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    gap:2px;
  }
  .action-btn-circle .sub{
    font-size:7px;
    font-weight:400;
    opacity:.6;
    text-transform:uppercase;
  }

  .zone-caption{
    position:absolute;
    font-size:8px;
    color:var(--ink);
    opacity:.4;
    letter-spacing:.05em;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="zone-caption" style="top:1%;left:3%;">FLOOR 3 · ROOM 5/9 · WIREFRAME — DEFAULT TURN STATE</div>

  <!-- Omen countdown -->
  <div class="omen-badge dashed">
    <div class="label">omen draw in</div>
    <div class="count">2</div>
  </div>

  <!-- Ghost placeholder for future hamburger menu -->
  <div class="menu-ghost dashed">
    <div class="glyph">≡</div>
    <div class="label">menu</div>
  </div>

  <!-- Back enemy -->
  <div class="enemy back">
    <div class="intent-pill">strike<br>4–6</div>
    <div class="sprite-box dashed">ENEMY<br>(back)</div>
    <div class="hp-horiz"><div class="fill" style="width:80%;"></div></div>
    <div class="status-row">
      <div class="status-chip">Bn</div>
    </div>
  </div>

  <!-- Front-left enemy -->
  <div class="enemy front-left">
    <div class="intent-pill">chill<br>touch</div>
    <div class="sprite-box dashed">ENEMY<br>L</div>
    <div class="hp-horiz"><div class="fill" style="width:45%;"></div></div>
    <div class="status-row">
      <div class="status-chip">Ch</div>
      <div class="status-chip">Vu</div>
    </div>
  </div>

  <!-- Front-right enemy -->
  <div class="enemy front-right">
    <div class="intent-pill">evade</div>
    <div class="sprite-box dashed">ENEMY<br>R</div>
    <div class="hp-horiz"><div class="fill" style="width:100%;"></div></div>
    <div class="status-row">
      <div class="status-chip">+2</div>
      <div class="status-more">more</div>
    </div>
  </div>

  <!-- Companions -->
  <div class="companion left">
    <div class="sprite-box dashed">COMP<br>L</div>
    <div class="label">ferret</div>
  </div>
  <div class="companion right">
    <div class="sprite-box dashed">COMP<br>R</div>
    <div class="label">—</div>
  </div>

  <!-- Vessel -->
  <div class="vessel">
    <div class="sprite-box dashed">VESSEL</div>
    <div class="hp-horiz"><div class="fill" style="width:68%;"></div></div>
    <div class="status-row">
      <div class="status-chip">Po</div>
    </div>
  </div>

  <!-- Action bar -->
  <div class="action-bar">
    <div class="action-btn dashed">
      SUPPORT
      <span class="sub">ability</span>
    </div>
    <div class="action-btn dashed">
      CONSUMABLE
      <span class="sub">item</span>
    </div>
  </div>
  <div class="action-btn-circle">
    ACTION
    <span class="sub">attack / evade</span>
  </div>

</div>
</body>
</html>
