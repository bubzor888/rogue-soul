<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Combat Wireframe — Action Bucket Item Select</title>
<style>
  :root{
    --ink:#3a4a5a;
    --line:#7c8fa3;
    --bg:#eef1f4;
    --card:#ffffff;
    --hp:#c0596b;
    --hp-track:#e3dcdc;
    --status:#c9a24a;
    --intent:#9a5fb8;
    --sheet-shadow: rgba(29,38,48,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#1d2630;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .screen{
    position:relative;
    width:100%;
    max-width:460px;
    height:100dvh;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .dashed{
    border:1.5px dashed var(--line);
    border-radius:6px;
    background:var(--card);
  }
  .zone-caption{
    position:absolute;
    font-size:8px;
    color:var(--ink);
    opacity:.4;
    letter-spacing:.05em;
    top:1%;left:3%;
  }

  /* ---------- Dimmed backdrop of the combat scene behind the sheet ---------- */
  .backdrop{
    position:absolute;
    inset:0;
    opacity:.4;
    filter:grayscale(.3);
  }
  .backdrop .enemy{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:26%;
  }
  .backdrop .enemy.back{ top:18%; left:50%; }
  .backdrop .enemy.front-left{ top:36%; left:20%; }
  .backdrop .enemy.front-right{ top:36%; left:80%; }
  .backdrop .sprite-box{
    width:100%;
    aspect-ratio:1/1.1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--ink);
  }
  .backdrop .hp-horiz{
    width:90%;
    height:9px;
    border-radius:4px;
    background:var(--hp-track);
    border:1px solid var(--line);
    margin-top:4px;
  }
  .backdrop .vessel{
    position:absolute;
    top:72%;
    left:50%;
    transform:translate(-50%,-50%);
    width:26%;
  }
  .backdrop .vessel .sprite-box{ aspect-ratio:1/1.2; width:100%; }

  /* ---------- Selection sheet: slides up, covers the action bar + lower scene ---------- */
  .select-sheet{
    position:absolute;
    left:0; right:0; bottom:0;
    height:54%;
    background:var(--card);
    border-top:1.5px dashed var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px var(--sheet-shadow);
    z-index:10;
    display:flex;
    flex-direction:column;
    padding:14px 4% calc(env(safe-area-inset-bottom) + 10px);
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .sheet-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .sheet-cancel{
    font-size:9px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
    padding:5px 9px;
    border:1.5px dashed var(--line);
    border-radius:10px;
  }

  .item-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    overflow-y:auto;
  }
  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
  }
  .item-row .icon{
    flex:0 0 auto;
    width:38px; height:38px;
    border-radius:8px;
    border:1.5px dashed var(--line);
    background:#f4f7fa;
    display:flex; align-items:center; justify-content:center;
    font-size:8px;
    color:var(--ink);
    opacity:.7;
    text-transform:uppercase;
    text-align:center;
  }
  .item-row .info{
    flex:1;
  }
  .item-row .name{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:2px;
  }
  .item-row .sub{
    font-size:10px;
    color:var(--ink);
    opacity:.65;
  }
  .item-row .charges{
    flex:0 0 auto;
    display:flex;
    gap:3px;
    align-items:center;
  }
  .item-row .charges .dot{
    width:11px; height:11px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:700;
    line-height:1;
    color:transparent;
  }
  /* Spent charge: a red X in place of the circle entirely, not inside one */
  .item-row .charges .dot.spent{
    border:none;
    background:none;
    font-size:15px;
    color:var(--hp);
  }
  .item-row .charges .unlimited{
    font-size:9px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.5;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="zone-caption">FLOOR 3 · ROOM 5/9 · WIREFRAME — ACTION BUCKET TAPPED, CHOOSING WHAT TO USE</div>

  <!-- Dimmed combat scene behind the sheet, so context isn't lost -->
  <div class="backdrop">
    <div class="enemy back">
      <div class="sprite-box dashed">ENEMY<br>(back)</div>
      <div class="hp-horiz"></div>
    </div>
    <div class="enemy front-left">
      <div class="sprite-box dashed">ENEMY<br>L</div>
      <div class="hp-horiz"></div>
    </div>
    <div class="enemy front-right">
      <div class="sprite-box dashed">ENEMY<br>R</div>
      <div class="hp-horiz"></div>
    </div>
    <div class="vessel">
      <div class="sprite-box dashed">VESSEL</div>
      <div class="hp-horiz"></div>
    </div>
  </div>

  <!-- Selection sheet: lists everything usable in the tapped bucket -->
  <div class="select-sheet">
    <div class="sheet-header">
      <div class="sheet-title">Choose your attack</div>
      <div class="sheet-cancel">cancel</div>
    </div>

    <div class="item-list">

      <!-- Default Strike: always available, unlimited use, per HLD-COMBAT-011 -->
      <div class="item-row dashed">
        <div class="icon">fist</div>
        <div class="info">
          <div class="name">Default Strike</div>
          <div class="sub">2 physical &middot; single target</div>
        </div>
        <div class="charges">
          <span class="unlimited">unlimited</span>
        </div>
      </div>

      <!-- Owned weapon: Walking Staff, Pilgrim starting item -->
      <div class="item-row dashed">
        <div class="icon">item<br>art</div>
        <div class="info">
          <div class="name">Walking Staff</div>
          <div class="sub">6 physical &middot; single target</div>
        </div>
        <div class="charges">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <!-- Owned weapon: Rope Flail, picked up as loot -->
      <div class="item-row dashed">
        <div class="icon">item<br>art</div>
        <div class="info">
          <div class="name">Rope Flail</div>
          <div class="sub">4 physical &middot; hits all enemies</div>
        </div>
        <div class="charges">
          <span class="dot spent">&times;</span><span class="dot spent">&times;</span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
