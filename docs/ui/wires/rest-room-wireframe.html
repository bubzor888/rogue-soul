<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rest Room Wireframe</title>
<style>
  :root{
    --ink:#3a4a5a;
    --line:#7c8fa3;
    --bg:#eef1f4;
    --card:#ffffff;
    --hp:#c0596b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#1d2630;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .screen{
    position:relative;
    width:100%;
    max-width:460px;
    min-height:100dvh;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
    padding:env(safe-area-inset-top) 4% calc(env(safe-area-inset-bottom) + 14px) 4%;
    display:flex;
    flex-direction:column;
  }
  .dashed{
    border:1.5px dashed var(--line);
    border-radius:6px;
    background:var(--card);
  }
  .zone-caption{
    font-size:8px;
    color:var(--ink);
    opacity:.4;
    letter-spacing:.05em;
    margin:6px 0 2px 2px;
  }

  /* ---------- Ghost hamburger menu (copied verbatim from combat/room-select wireframes) ---------- */
  .menu-ghost{
    position:absolute;
    top:3%;
    right:4%;
    width:28%;
    padding:5px 4px;
    text-align:center;
    opacity:.4;
    z-index:5;
  }
  .menu-ghost .glyph{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .menu-ghost .label{
    font-size:8px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
  }

  /* ---------- Center stage: fills the full screen, vertically centers the
       rest card + continue bar ---------- */
  .center-stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:center;
    min-height:0;
  }

  .heading{
    text-align:center;
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 14px;
  }

  /* ---------- Rest card: flavour + heal amount, no sprite ---------- */
  .rest-card{
    padding:26px 20px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .rest-flavour{
    font-size:12px;
    font-style:italic;
    line-height:1.6;
    color:var(--ink);
    opacity:.85;
    max-width:320px;
  }
  .heal-amount{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .heal-amount .num{
    font-size:28px;
    font-weight:800;
    color:var(--hp);
    line-height:1;
  }
  .heal-amount .label{
    font-size:9px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.6;
  }

  /* ---------- Continue: single action, no choice to make ---------- */
  .continue-bar{
    margin-top:16px;
    padding:14px;
    text-align:center;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--hp);
    border:1.5px dashed var(--hp);
    border-radius:6px;
    background:#faf0f1;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="zone-caption">FLOOR 3 · ROOM 6/9 · WIREFRAME — REST (POST-ELITE)</div>

  <!-- Ghost hamburger, top-right, matches combat/room-select screens -->
  <div class="menu-ghost dashed">
    <div class="glyph">&#8801;</div>
    <div class="label">menu</div>
  </div>

  <div class="center-stage">
    <div class="heading">A much needed rest</div>

    <!-- Rest presence: flavour text + heal amount, no sprite -->
    <div class="rest-card dashed">
      <div class="rest-flavour">
        "For a moment, the weight of the road lifts. You let yourself breathe."
      </div>
      <div class="heal-amount">
        <div class="num">+15 HP</div>
        <div class="label">heal amount — placeholder, TBD</div>
      </div>
    </div>

    <!-- Single action — no choice, just continue -->
    <div class="continue-bar">
      Keep going...
    </div>
  </div>

</div>
</body>
</html>
